; Reference copy — the live config auto-creates (and hot-reloads) at:
;   Documents\My Games\Fallout4VR\PAPER_Toolkit_Config\PAPER_Toolkit.ini

[PAPER_Toolkit]
; Master switch for the weapon-part reload runtime (clip harvest, motion
; learner, and part-drive scrubbing through ROCK's provider API).
; Hot-reloadable: toggling while in game shuts the runtime down/brings it back.
bEnabled = true

; Which motion-path source may DRIVE a grabbed part. Data collection is
; always on in every mode (the learner keeps recording, the harvest keeps
; extracting clips), so switching modes applies instantly to NEW grips with
; whatever both sources have accumulated.
;   hybrid   - learned paths outrank authored clip strokes; authored
;              bootstraps parts not taught yet (original behavior)
;   authored - only clip-harvested strokes drive parts
;   learned  - only runtime-learned paths drive parts
sMotionPathMode = hybrid

; Log verbosity: 0=trace 1=debug 2=info 3=warn 4=error 5=critical 6=off.
; Hot-reloadable; drop to 1 or 0 when collecting harvest/scrub diagnostics.
iLogLevel = 2

; Trigger selects the grip type on eligible parts, PER HAND: grab alone =
; normal authority/carry grab; that hand's trigger (before or during the
; hold, part-carry included) = attach-only manipulation, sticky until the
; part is released. A hand's trigger does nothing here while it owns the
; firing grip, so firing never flips the other hand's grabs.
; false = eligible parts are always attach-only (scrub on grab).
bRequireTriggerUnlock = true

; Learner grouping (mapper side, hot-reloadable; applies to strokes learned
; AFTER a change). Co-timed followers: parts that move NON-rigidly but only
; during the leader's stroke window ride the scrub (P320 barrel tilting
; while the slide travels, a bullet advancing during the bolt pull).
; fCoTimedMinOverlap = fraction of the part's total motion that must fall
; inside the leader's window (keeps separate reload phases apart);
; fCoTimedMaxArcRatio = max follower motion relative to the leader stroke.
bCoTimedFollowers = true
fCoTimedMinOverlap = 0.70
fCoTimedMaxArcRatio = 1.50

; Stage transitions: a learned stroke that starts where the primary stroke
; ends (mag-in after mag-out) is kept as a RETURN stage, and the scrub
; hands over between stages at the physical travel extremes — each
; direction keeps its own path and min/max. Chain tolerance = how close
; the return stroke's start must be to the primary's end to count chained.
bStageTransitions = true
fStageChainToleranceGameUnits = 2.0

; Max/min trigger zone as a FRACTION of each part's full travel: the part
; counts as at-max / at-rest when its displacement from rest is within
; this percentage of the extreme. Percentage-based so short pistol slides
; and long bolt pulls trigger identically. Drives max-travel events
; (shell eject) AND stage-transition triggers. 0.02 - 0.45.
fTravelExtremeTolerance = 0.10

; Shell-eject test: reaching max travel on a scrubbed bolt/slide-class part
; (bolt, slide, charging handle, pump) fires the engine's own shell-casing
; ejection for the equipped weapon — the same P-Casing debris spawn used
; when firing. One eject per full stroke (re-arms once the part comes
; halfway back toward rest); weapons without a casing model do nothing.
bShellEjectOnMaxTravel = true

; Re-record mode: while true, EVERY save of this INI (and every game
; start) wipes all learned motion data so reloads re-record from scratch
; under the current grouping settings (drained authored strokes are wiped
; too and re-harvest on the next equip / clip playback). With the motion
; library on, the wipe also deletes the on-disk library files (files
; marked "curated": true are kept). Leave true during a re-record
; session, set false when done.
bResetLearnedPaths = false

; Motion library: one human-editable JSON per weapon in
; PAPER_Toolkit_Config\MotionLibrary — mapped reloads survive game restarts
; and the files are the fine-tuning surface (stageName/notes fields are
; yours; they round-trip untouched). Loaded on weapon equip; disk data
; seeds the learner, anything learned live always wins. Saves happen on a
; background writer once learning settles. ReadOnly = load but never
; write; a per-file "curated": true protects a single hand-tuned file
; from being overwritten or wiped.
bMotionLibrary = true
bMotionLibraryReadOnly = false

; Rich mapping capture: append immutable evidence to one sibling
; <weapon>.capture.jsonl file in MotionLibrary. Includes the full
; ROCK/OMOD/node inventory and geometry, every raw learned stroke (even
; rejected/replaced/interrupted), and authored clip tracks plus markers.
; Gameplay never loads this forensic archive. Re-record wipes keep it.
; bMotionLibraryReadOnly disables every disk write, including capture.
bRichMotionCapture = true

; Full-subtree observation: the mapper watches EVERY named node under
; the weapon root, not only parts with colliders — bullets riding a mag,
; small linkages — so the full animation gets mapped and persisted.
; Observation-only parts are never grabbable.
bFullSubtreeObservation = true

; AttachOnly allowlist — which part classes MAY become attach-only grips.
; Hot-reloadable. The class switch is only half the gate: a part must ALSO
; have a motion path (clip-harvested or learned, under the active mode) to
; actually be attach-only. A part that does not move keeps its normal grip
; no matter what is enabled here — e.g. with bAttachOnlyReceiver=true, a
; receiver nif that the animation moves glues to the hand, a static one on
; the same weapon stays a regular support grip.
bAttachOnlyBolt = true
bAttachOnlySlide = true
bAttachOnlyChargingHandle = true
bAttachOnlyPump = true
bAttachOnlyBreakAction = true
bAttachOnlyCylinder = true
bAttachOnlyLever = true
bAttachOnlyLatch = false
bAttachOnlyMagazine = true
bAttachOnlyMagwell = true
bAttachOnlyChamber = true
bAttachOnlyShell = true
bAttachOnlyRound = true
bAttachOnlyLaserCell = true
bAttachOnlyCosmeticAmmo = true
bAttachOnlyReceiver = false
bAttachOnlyBarrel = false
bAttachOnlyHandguard = false
bAttachOnlyForegrip = false
bAttachOnlyStock = false
bAttachOnlyGrip = false
bAttachOnlySight = false
bAttachOnlyAccessory = false
bAttachOnlyOther = false
