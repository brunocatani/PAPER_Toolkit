;   Documents\My Games\Fallout4VR\PAPERRedux_Config\PAPERRedux.ini

[PAPERRedux]
; Master switch for the weapon-part reload runtime (clip harvest, motion
; learner, and part-drive scrubbing through ROCK's provider API).
; Hot-reloadable: toggling while in game shuts the runtime down/brings it back.
bEnabled = true

; Which motion-path source may DRIVE a grabbed part. Data collection is
; always on in every mode (the learner keeps recording, the harvest keeps
; extracting clips), so switching modes applies instantly to NEW grips with
; whatever both sources have accumulated.
;   hybrid   - learned paths outrank authored clip strokes; authored
;              bootstraps parts not taught yet (original behavior)
;   authored - only clip-harvested strokes drive parts
;   learned  - only runtime-learned paths drive parts
sMotionPathMode = hybrid

; Log verbosity: 0=trace 1=debug 2=info 3=warn 4=error 5=critical 6=off.
; Hot-reloadable; drop to 1 or 0 when collecting harvest/scrub diagnostics.
iLogLevel = 2

; Trigger selects the grip type on eligible parts, PER HAND: grab alone =
; normal authority/carry grab; that hand's trigger (before or during the
; hold, part-carry included) = attach-only manipulation, sticky until the
; part is released. A hand's trigger does nothing here while it owns the
; firing grip, so firing never flips the other hand's grabs.
; false = eligible parts are always attach-only (scrub on grab).
bRequireTriggerUnlock = true

; AttachOnly allowlist — which part classes MAY become attach-only grips.
; Hot-reloadable. The class switch is only half the gate: a part must ALSO
; have a motion path (clip-harvested or learned, under the active mode) to
; actually be attach-only. A part that does not move keeps its normal grip
; no matter what is enabled here — e.g. with bAttachOnlyReceiver=true, a
; receiver nif that the animation moves glues to the hand, a static one on
; the same weapon stays a regular support grip.
bAttachOnlyBolt = true
bAttachOnlySlide = true
bAttachOnlyChargingHandle = true
bAttachOnlyPump = true
bAttachOnlyBreakAction = true
bAttachOnlyCylinder = true
bAttachOnlyLever = true
bAttachOnlyLatch = false
bAttachOnlyMagazine = true
bAttachOnlyMagwell = true
bAttachOnlyChamber = true
bAttachOnlyShell = true
bAttachOnlyRound = true
bAttachOnlyLaserCell = true
bAttachOnlyCosmeticAmmo = true
bAttachOnlyReceiver = false
bAttachOnlyBarrel = false
bAttachOnlyHandguard = false
bAttachOnlyForegrip = false
bAttachOnlyStock = false
bAttachOnlyGrip = false
bAttachOnlySight = false
bAttachOnlyAccessory = false
bAttachOnlyOther = false
